[workspace]
resolver = "2"
members = [
    "crates/threadcraft",
    "plugins/threadcraft-screws",
    "plugins/threadcraft-inserts",
    "plugins/threadcraft-nuts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"
threadcraft = { path = "crates/threadcraft" }
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
