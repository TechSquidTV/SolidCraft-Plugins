[workspace]
resolver = "2"
# Every folder under crates/ and plugins/ is a member, so a new plugin needs no entry here.
members = ["crates/*", "plugins/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
extrusions = { path = "crates/extrusions" }
fasteners = { path = "crates/fasteners" }
plugin-kit = { path = "crates/plugin-kit" }
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
