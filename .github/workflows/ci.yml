name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Clippy, native
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, wasm plugins
        run: >
          cargo clippy --locked --target wasm32-unknown-unknown
          -p threadcraft-screws -p threadcraft-inserts -p threadcraft-nuts -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - uses: Swatinem/rust-cache@v2
      - run: ./build.sh
      - name: Check the packaged plugins
        run: |
          for id in threadcraft-screws threadcraft-inserts threadcraft-nuts; do
            test -s "dist/$id/plugin.wasm"
            test -s "dist/$id/plugin.json"
          done
