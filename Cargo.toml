[workspace]
resolver = "2"
members = [
    "crates/plugin-kit",
    "crates/fasteners",
    "plugins/techsquid-screws",
    "plugins/techsquid-inserts",
    "plugins/techsquid-nuts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde_json = "1"
fasteners = { path = "crates/fasteners" }
plugin-kit = { path = "crates/plugin-kit" }
wit-bindgen = "0.46"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
